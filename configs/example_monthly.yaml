# Runtime example. Supply prepared data or edit the data paths before training.
model_type: mttgnet
seed: 123
device: cuda
data:
  values_path: data/processed/hadcrut5_values.npy
  timestamps_path: data/processed/hadcrut5_timestamps.npy
  target_index: 0
  co2_index: 1
split:
  train_end: '1990-12-15 00:00:00'
  val_end: '2004-12-15 00:00:00'
  test_end: '2014-12-15 00:00:00'
dataset:
  recent_length: 60
  horizon: 1
  daily_anchors: 0
  yearly_anchors: 0
  train_step_size: 1
  eval_step_size: 1
  time_encode: true
model_params:
  hidden_dim: 32
  dropout: 0.1
  memory_slots: 64
  mem_top_k: 4
  num_gru_layers: 1
  use_memory: true
  use_var_gnn: true
  use_variable_encoder: true
  use_shift_encoder: true
  use_time_bias: true
  use_gate: true
  var_encoder_type: gat
  use_calendar: true
  temporal_encoder: gru
training:
  batch_size: 64
  epochs: 10000
  learning_rate: 0.0001
  weight_decay: 0.0005
  lr_decay: 5.0e-06
  lr_min: 1.0e-05
  patience: 1000
  early_stop_min_delta: 0.0005
  gradient_clip: 1.0
  num_workers: 4
  pin_memory: true
  use_amp: true
  grad_accum_steps: 1
loss:
  delta_weight: 0.1
  horizon_weight_power: 1.0
  horizon_weight_max: 1.5
  extreme_weight: 0.0
  extreme_threshold: 1.5
output:
  checkpoint_dir: outputs/example_monthly/checkpoints
  result_dir: outputs/example_monthly/results
  legacy_scaler_export: false
